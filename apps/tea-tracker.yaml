apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tea-tracker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.local.ongy.net/ongy/argocd.git
    path: tea-tracker
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tea-tracker
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
