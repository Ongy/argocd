apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
spec:
  selector:
    app: hermes
  ports:
  - protocol: TCP
    port: 8642
    targetPort: gateway
    name: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webapp
spec:
  selector:
    app: hermes
  ports:
  - protocol: TCP
    port: 9120
    targetPort: webapp
    name: webapp
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
spec:
  selector:
    app: hermes
  ports:
  - protocol: TCP
    port: 9119
    targetPort: dashboard
    name: dashboard
