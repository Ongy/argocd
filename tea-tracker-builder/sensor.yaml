apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: tea-tracker-builder
spec:
  template:
    serviceAccountName: argo-workflows-server
  dependencies:
    - name: webhook-dep
      eventSourceName: tea-tracker-builder-webhook
      eventName: tea-tracker-builder-webhook
      filters:
        exprs:
          - expr: ref =~ "^v?[0-9]+\\.[0-9]+\\.[0-9]+$" && ref_type == "tag"
            fields:
              - name: ref
                path: body.ref
              - name: ref_type
                path: body.ref_type
  triggers:
    - template:
        name: argo-workflow-trigger
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: tea-tracker-build-
              spec:
                arguments:
                  parameters:
                  - name: rev
                    value: __TO_BE_REPLACD__
                  - name: repo
                    value: __TO_BE_REPLACD__
                workflowTemplateRef:
                  name: tea-tracker-builder
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.ref
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.repository.clone_url
              dest: spec.arguments.parameters.1.value
