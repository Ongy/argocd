apiVersion: v1
kind: ConfigMap
metadata:
  name: psql-config
  namespace: psql
data:
  postgresql.conf: |
    include '/var/lib/postgresql/data/postgresql.conf'

    hba_file = '/etc/postgresql/pg_hba.conf'

    ssl = on
    ssl_ca_file = '/tls-secrets/..data/ca.crt'
    ssl_cert_file = '/tls-secrets/..data/tls.crt'
    ssl_key_file = '/tls-secrets/..data/tls.key'
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD

    # "local" is for Unix domain socket connections only
    local   all             all                                     trust
    # IPv4 local connections:
    host    all             all             127.0.0.1/32            trust
    # IPv6 local connections:
    host    all             all             ::1/128                 trust
    # Allow replication connections from localhost, by a user with the
    # replication privilege.
    local   replication     all                                     trust
    host    replication     all             127.0.0.1/32            trust
    host    replication     all             ::1/128                 trust

    # do not let the "postgres" superuser login via a certificate
    hostssl all             postgres        ::/0                    reject
    hostssl all             postgres        0.0.0.0/0               reject

    hostssl all             all             ::/0                    cert
    hostssl all             all             0.0.0.0/0               cert

    host    all             all             all                     scram-sha-256
