apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: psql
  name: psql
  namespace: psql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psql
  template:
    metadata:
      labels:
        app: psql
    spec:
      volumes:
        - name: psql-data
          persistentVolumeClaim:
            claimName: psql-data
            readOnly: false
        - name: psql-tls-secrets
          secret:
            secretName: psql-server-secret
            optional: true
            defaultMode: 0640
        - name: psql-config
          configMap:
            name: psql-config
            defaultMode: 0644
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - image: postgres:17-alpine
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
          env:
          - name: POSTGRES_PASSWORD
            value: password
          - name: POSTGRES_INITDB_ARGS
            value: "--data-checksums"
          name: psql
          volumeMounts:
            - mountPath: "/var/lib/postgresql/data"
              subPath: data-17
              name: psql-data
            - name: psql-tls-secrets
              mountPath: "/tls-secrets"
              readOnly: true
            - name: psql-config
              mountPath: "/etc/postgresql"
              readOnly: true
