apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: stork
  name: stork
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stork
  template:
    metadata:
      labels:
        app: stork
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
      volumes:
        - name: psql-tls-raw
          secret:
            secretName: psql-client-secret
            defaultMode: 416
            optional: true
        - name: psql-tls-shared
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        - name: tmp-dir
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
        - name: stork-lib-dir
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
        - name: run-dir
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
      containers:
        - name: stork-server
          image: cr.local.ongy.net/stork:latest
          imagePullPolicy: Always
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            privileged: false
          env:
            - name: STORK_DATABASE_HOST
              value: psql.psql
            - name: STORK_DATABASE_PORT
              value: "5432"
            - name: STORK_DATABASE_NAME
              value: stork
            - name: STORK_DATABASE_USER_NAME
              value: stork
            - name: STORK_DATABASE_PASSWORD
              value: ""
            - name: STORK_DATABASE_SSLMODE
              value: verify-full
            - name: STORK_DATABASE_SSLCERT
              value: /psql-tls-secrets/tls.crt
            - name: STORK_DATABASE_SSLKEY
              value: /psql-tls-secrets/tls.key
            - name: STORK_DATABASE_SSLROOTCERT
              value: /psql-tls-secrets/ca.crt
            - name: STORK_REST_HOST
              value: 0.0.0.0
            - name: STORK_REST_PORT
              value: "8080"
            - name: STORK_REST_STATIC_FILES_DIR
              value: /usr/share/stork/www
            - name: STORK_OIDC_ISSUER_URL
              value: https://keycloak.local.ongy.net/realms/local.ongy.net
            - name: STORK_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-stork
                  key: client_id
            - name: STORK_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-stork
                  key: client_secret
            - name: STORK_OIDC_REDIRECT_URI
              value: https://stork.local.ongy.net/oidc/callback
          volumeMounts:
            - mountPath: "/psql-tls-secrets"
              name: psql-tls-shared
            - mountPath: "/tmp"
              name: tmp-dir
            - mountPath: "/var/lib/stork"
              name: stork-lib-dir
            - mountPath: "/run"
              name: run-dir
          readinessProbe:
            httpGet:
              path: /
              port: 8080
        - name: cert-syncer
          image: alpine:latest
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            privileged: false
          command:
            - sh
            - -c
            - |
              RAW_DIR="/psql-tls-raw"
              SHARED_DIR="/psql-tls-shared"

              copy_files() {
                echo "Copying certificates..."
                cp -f "$RAW_DIR/tls.crt" "$SHARED_DIR/tls.crt"
                cp -f "$RAW_DIR/tls.key" "$SHARED_DIR/tls.key"
                cp -f "$RAW_DIR/ca.crt" "$SHARED_DIR/ca.crt"
                chmod 600 "$SHARED_DIR/tls.key"
                chmod 644 "$SHARED_DIR/tls.crt" "$SHARED_DIR/ca.crt"
              }

              copy_files

              while true; do
                sleep 3600
                if [ "$RAW_DIR/tls.key" -nt "$SHARED_DIR/tls.key" ] || \
                   [ "$RAW_DIR/tls.crt" -nt "$SHARED_DIR/tls.crt" ] || \
                   [ "$RAW_DIR/ca.crt" -nt "$SHARED_DIR/ca.crt" ]; then
                  echo "Newer certificate files detected, updating..."
                  copy_files
                fi
              done
          volumeMounts:
            - mountPath: /psql-tls-raw
              name: psql-tls-raw
              readOnly: true
            - mountPath: /psql-tls-shared
              name: psql-tls-shared
