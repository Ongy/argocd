apiVersion: v1
kind: ConfigMap
metadata:
  name: obico-env
data:
  DEBUG: "False"
  WEBPACK_LOADER_ENABLED: "False"
  SITE_USES_HTTPS: "True"
  CSRF_TRUSTED_ORIGINS: '["https://obico.local.ongy.net"]'
  REDIS_URL: "redis://obico-redis:6379/0"
  ML_API_HOST: "http://obico-ml-api:3333"
  INTERNAL_MEDIA_HOST: "http://obico-web:3334"
  OCTOPRINT_TUNNEL_PORT_RANGE: "0-0"
  DATABASE_URL: "postgresql://obico:@psql.psql/obico?sslmode=verify-full&sslcert=%2Fpsql-tls-secrets%2Ftls.crt&sslkey=%2Fpsql-tls-secrets%2Ftls.key&sslrootcert=%2Fpsql-tls-secrets%2Fca.crt"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obico-web
  labels:
    app: obico-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obico-web
  template:
    metadata:
      labels:
        app: obico-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: birdo
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: obico-data
      - name: media
        persistentVolumeClaim:
          claimName: obico-media
      - name: static
        emptyDir: {}
      - name: psql-tls-secrets
        secret:
          defaultMode: 416
          optional: true
          secretName: psql-client-secret
      initContainers:
      - name: collectstatic
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - python
        - manage.py
        - collectstatic
        - -v
        - "2"
        - --noinput
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        volumeMounts:
        - name: static
          mountPath: /app/static_build
      - name: migrate
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - python
        - manage.py
        - migrate
        - --noinput
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        volumeMounts:
        - name: data
          mountPath: /data
        - name: psql-tls-secrets
          mountPath: /psql-tls-secrets
          readOnly: true
      containers:
      - name: server
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - daphne
        - -b
        - 0.0.0.0
        - -p
        - "3334"
        - config.routing:application
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        ports:
        - name: http
          containerPort: 3334
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /hc/
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
        - name: static
          mountPath: /app/static_build
        - name: media
          mountPath: /app/static_build/media
        - name: psql-tls-secrets
          mountPath: /psql-tls-secrets
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
      - name: tasks
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - celery
        - -A
        - config
        - worker
        - --beat
        - --schedule
        - /data/celerybeat-schedule
        - -l
        - info
        - -c
        - "2"
        - -Q
        - realtime,celery
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        volumeMounts:
        - name: data
          mountPath: /data
        - name: media
          mountPath: /app/static_build/media
        - name: psql-tls-secrets
          mountPath: /psql-tls-secrets
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obico-ml-api
  labels:
    app: obico-ml-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obico-ml-api
  template:
    metadata:
      labels:
        app: obico-ml-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: birdo
      automountServiceAccountToken: false
      containers:
      - name: ml-api
        image: ghcr.io/thespaghettidetective/obico-ml-api-cpu:2026.10.2
        command:
        - gunicorn
        - --bind=0.0.0.0:3333
        - --workers=1
        - --timeout=120
        - --access-logfile=-
        - wsgi
        env:
        - name: FLASK_APP
          value: server.py
        ports:
        - name: http
          containerPort: 3333
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /hc/
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obico-redis
  labels:
    app: obico-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obico-redis
  template:
    metadata:
      labels:
        app: obico-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: birdo
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: docker.io/library/redis:7
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          privileged: false
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
