apiVersion: v1
kind: ConfigMap
metadata:
  name: obico-env
data:
  DEBUG: "False"
  WEBPACK_LOADER_ENABLED: "False"
  SITE_USES_HTTPS: "True"
  DJANGO_SETTINGS_MODULE: "config.local_settings"
  CSRF_TRUSTED_ORIGINS: '["https://obico.local.ongy.net"]'
  REDIS_URL: "redis://obico-redis:6379/0"
  ML_API_HOST: "http://obico-ml-api:3333"
  INTERNAL_MEDIA_HOST: "http://obico-web:3334"
  OCTOPRINT_TUNNEL_PORT_RANGE: "0-0"
  DATABASE_URL: "postgresql://obico:@psql.psql/obico?sslmode=verify-full&sslcert=%2Fpsql-tls-secrets%2Ftls.crt&sslkey=%2Fpsql-tls-secrets%2Ftls.key&sslrootcert=%2Fpsql-tls-secrets%2Fca.crt"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obico-local-settings
data:
  local_settings.py: |
    from config.settings import *

    class AutoLoginMiddleware:
        def __init__(self, get_response):
            self.get_response = get_response

        def __call__(self, request):
            if (
                not request.user.is_authenticated
                and not request.META.get('HTTP_AUTHORIZATION')
                and not request.path.startswith('/api/v1/octo/')
                and not request.path.startswith('/hc/')
            ):
                from django.contrib.auth import get_user_model, login
                User = get_user_model()
                user = User.objects.filter(is_superuser=True, is_active=True).order_by('id').first()
                if user is not None:
                    login(request, user, backend='app.accounts.SyndicateSpecificBackend')
            return self.get_response(request)

    _auth_idx = MIDDLEWARE.index('django.contrib.auth.middleware.AuthenticationMiddleware')
    MIDDLEWARE.insert(_auth_idx + 1, 'config.local_settings.AutoLoginMiddleware')
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obico-web
  labels:
    app: obico-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obico-web
  template:
    metadata:
      labels:
        app: obico-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: birdo
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: obico-data
      - name: media
        persistentVolumeClaim:
          claimName: obico-media
      - name: static
        emptyDir: {}
      - name: local-settings
        configMap:
          name: obico-local-settings
      - name: psql-tls-secrets
        secret:
          defaultMode: 416
          optional: true
          secretName: psql-client-secret
      initContainers:
      - name: collectstatic
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - python
        - manage.py
        - collectstatic
        - -v
        - "2"
        - --noinput
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        volumeMounts:
        - name: static
          mountPath: /app/static_build
        - name: local-settings
          mountPath: /app/config/local_settings.py
          subPath: local_settings.py
          readOnly: true
      - name: migrate
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -c
        - |
          set -e
          python manage.py migrate --noinput
          python manage.py shell -c "
          from django.contrib.sites.models import Site
          from app.models import Syndicate
          site = Site.objects.first()
          if site:
              Site.objects.exclude(pk=site.pk).delete()
              site.domain = 'obico.local.ongy.net'
              site.name = 'Obico'
              site.save()
          else:
              site = Site.objects.create(domain='obico.local.ongy.net', name='Obico')
          for s in Syndicate.objects.all():
              s.sites.add(site)
          "
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        volumeMounts:
        - name: data
          mountPath: /data
        - name: local-settings
          mountPath: /app/config/local_settings.py
          subPath: local_settings.py
          readOnly: true
        - name: psql-tls-secrets
          mountPath: /psql-tls-secrets
          readOnly: true
      containers:
      - name: server
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - daphne
        - -b
        - 0.0.0.0
        - -p
        - "3334"
        - config.routing:application
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        ports:
        - name: http
          containerPort: 3334
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /hc/
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /data
        - name: static
          mountPath: /app/static_build
        - name: media
          mountPath: /app/static_build/media
        - name: local-settings
          mountPath: /app/config/local_settings.py
          subPath: local_settings.py
          readOnly: true
        - name: psql-tls-secrets
          mountPath: /psql-tls-secrets
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
      - name: tasks
        image: ghcr.io/thespaghettidetective/obico-web:2026.10.2
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - celery
        - -A
        - config
        - worker
        - --beat
        - --schedule
        - /data/celerybeat-schedule
        - -l
        - info
        - -c
        - "2"
        - -Q
        - realtime,celery
        envFrom:
        - configMapRef:
            name: obico-env
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: obico-django-secret
              key: value
        volumeMounts:
        - name: data
          mountPath: /data
        - name: media
          mountPath: /app/static_build/media
        - name: local-settings
          mountPath: /app/config/local_settings.py
          subPath: local_settings.py
          readOnly: true
        - name: psql-tls-secrets
          mountPath: /psql-tls-secrets
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obico-ml-api
  labels:
    app: obico-ml-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obico-ml-api
  template:
    metadata:
      labels:
        app: obico-ml-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: birdo
      automountServiceAccountToken: false
      volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: dev-mpp
        hostPath:
          path: /dev/mpp_service
      containers:
      - name: ml-api
        image: cr.local.ongy.net/obico-ml-api:rk3588
        imagePullPolicy: Always
        securityContext:
          privileged: true
        command:
        - gunicorn
        - --bind=0.0.0.0:3333
        - --workers=1
        - --timeout=120
        - --access-logfile=-
        - wsgi
        env:
        - name: FLASK_APP
          value: server.py
        volumeMounts:
        - name: dev-dri
          mountPath: /dev/dri
        - name: dev-mpp
          mountPath: /dev/mpp_service
        ports:
        - name: http
          containerPort: 3333
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /hc/
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obico-redis
  labels:
    app: obico-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obico-redis
  template:
    metadata:
      labels:
        app: obico-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: birdo
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: docker.io/library/redis:7
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          privileged: false
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
