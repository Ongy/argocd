apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omada-cert
spec:
  commonName: omada.omada.svc.cluster.local
  dnsNames:
  - omada.omada.svc.cluster.local
  - omada.omada.svc
  - omada.omada
  - omada
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer
  secretName: omada-tls

